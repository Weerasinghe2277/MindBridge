name: mindbridge
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
