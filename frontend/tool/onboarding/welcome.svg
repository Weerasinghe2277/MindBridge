  <ellipse cx="450" cy="634" rx="110" ry="14" fill="#2F5A3D" opacity=".16"/>
  <path d="M410 590 L488 556 L500 626" fill="none" stroke="#2F5A3D" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M428 600 L492 578 L512 628" fill="none" stroke="#3A6647" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="512" cy="630" rx="24" ry="11" fill="#22261F"/>
  <rect x="366" y="470" width="78" height="126" rx="36" fill="#E9A84A"/>
  <path d="M378 505 Q420 520 456 506" stroke="#E9A84A" stroke-width="26" stroke-linecap="round" fill="none"/>
  <rect x="448" y="484" width="34" height="38" rx="8" fill="#FFFDF9"/>
  <path d="M482 494 q14 0 14 12 q0 12 -14 12" fill="none" stroke="#FFFDF9" stroke-width="6"/>
  <path d="M458 470 q-8 -12 0 -24 M472 470 q-8 -12 0 -24" fill="none" stroke="#FFFDF9" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <circle cx="448" cy="512" r="12" fill="#C68B64"/>
  <rect x="396" y="448" width="20" height="30" rx="8" fill="#B47A55"/>
  <circle cx="406" cy="424" r="36" fill="#C68B64"/>
  <path d="M370 424 C366 386 400 372 424 380 C446 386 450 404 444 418 C430 404 404 400 384 410 C380 424 376 440 372 446 Z" fill="#2F2A24"/>
  <path d="M396 428 q6 5 12 0 M420 426 q6 5 12 0" stroke="#2F2A24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M408 444 q8 6 16 0" stroke="#8A4E35" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="398" cy="440" r="6" fill="#E58F7E" opacity=".45"/>

  <!-- open notebook -->
  <g transform="translate(560 618) skewX(-18)">
    <rect x="0" y="0" width="58" height="34" rx="4" fill="#FFFDF9"/><rect x="60" y="0" width="58" height="34" rx="4" fill="#FFFDF9"/>
    <path d="M10 10 H48 M10 20 H40 M70 10 H108 M70 20 H96" stroke="#B8D39A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- floating leaves -->
  <use href="#leaf" fill="#4A7C59" transform="translate(560 300) rotate(-24)"/>
  <use href="#leaf" fill="#B8D39A" transform="translate(680 220) rotate(18) scale(.8)"/>
  <use href="#leaf" fill="#6E9E6F" transform="translate(1040 430) rotate(-40) scale(.7)"/>
