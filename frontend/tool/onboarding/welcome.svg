  <ellipse cx="300" cy="640" rx="170" ry="18" fill="#2F5A3D" opacity=".14"/>
  <rect x="248" y="420" width="30" height="220" rx="15" fill="#7A5A41"/>
  <path d="M263 520 L222 470" stroke="#7A5A41" stroke-width="14" stroke-linecap="round"/>
  <circle cx="190" cy="440" r="80" fill="#4A7C59"/>
  <circle cx="340" cy="440" r="86" fill="#3F6E4E"/>
  <circle cx="263" cy="372" r="112" fill="#4A7C59"/>
  <circle cx="230" cy="335" r="40" fill="#6E9E6F" opacity=".55"/>
  <circle cx="320" cy="410" r="26" fill="#6E9E6F" opacity=".45"/>

