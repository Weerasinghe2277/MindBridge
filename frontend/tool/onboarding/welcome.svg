      <stop offset="0" stop-color="#E6EEDD"/><stop offset="1" stop-color="#F6F2EA"/>
    </linearGradient>
    <g id="leaf"><path d="M0 0 C18 -26 56 -26 68 0 C56 26 18 26 0 0 Z"/><path d="M4 0 H60" stroke="#FFFDF9" stroke-opacity=".55" stroke-width="3" fill="none"/></g>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="330" fill="#3A6647" opacity=".06"/>
  <circle cx="120" cy="790" r="270" fill="#3A6647" opacity=".05"/>

  <!-- sun and clouds -->
  <circle cx="880" cy="210" r="118" fill="#FBEFD8" opacity=".6"/>
  <circle cx="880" cy="210" r="74" fill="#F7DFA8"/>
  <g fill="#FFFDF9" opacity=".9">
    <rect x="170" y="150" width="190" height="46" rx="23"/><rect x="215" y="122" width="96" height="52" rx="26"/>
    <rect x="960" y="320" width="150" height="38" rx="19"/><rect x="995" y="298" width="72" height="42" rx="21"/>
  </g>

  <!-- far hills and the bridge -->
  <path d="M0 500 Q260 400 560 470 T1200 440 V800 H0 Z" fill="#C5D7B3"/>
  <path d="M0 575 Q260 480 700 545 Q960 470 1200 540 V800 H0 Z" fill="#B8D39A"/>
  <path d="M672 540 C700 580 640 610 690 660 L790 660 C730 612 770 580 748 540 Z" fill="#E2ECF7"/>
  <path d="M700 566 q14 10 0 22 M724 600 q14 10 0 22" stroke="#FFFDF9" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
  <g fill="none" stroke="#2F5A3D" stroke-linecap="round">
    <path d="M610 548 Q710 488 810 548" stroke-width="14"/>
    <path d="M622 512 Q710 456 798 512" stroke-width="7"/>
    <path d="M648 528 V500 M680 512 V480 M710 506 V474 M740 512 V480 M772 528 V500" stroke-width="6"/>
  </g>

  <!-- front meadow -->
  <path d="M0 640 Q330 560 700 630 T1200 640 V800 H0 Z" fill="#A6C68A"/>
  <path d="M0 720 Q420 670 1200 730 V800 H0 Z" fill="#8FB676" opacity=".7"/>
  <g fill="#FFFDF9"><circle cx="760" cy="690" r="6"/><circle cx="820" cy="672" r="5"/><circle cx="1010" cy="700" r="6"/><circle cx="1080" cy="676" r="5"/><circle cx="140" cy="700" r="5"/></g>
  <g fill="#E59A2B"><circle cx="760" cy="690" r="2.5"/><circle cx="1010" cy="700" r="2.5"/></g>

