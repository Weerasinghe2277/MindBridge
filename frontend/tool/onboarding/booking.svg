  <circle cx="270" cy="220" r="9" fill="#2F5A3D"/>
  <g fill="#2B5C8A" opacity=".5"><circle cx="270" cy="160" r="5"/><circle cx="330" cy="220" r="5"/><circle cx="270" cy="280" r="5"/><circle cx="210" cy="220" r="5"/></g>

