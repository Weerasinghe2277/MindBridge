      <stop offset="0" stop-color="#E2ECF7"/><stop offset="1" stop-color="#F6F2EA"/>
    </linearGradient>
    <g id="leaf"><path d="M0 0 C18 -26 56 -26 68 0 C56 26 18 26 0 0 Z"/><path d="M4 0 H60" stroke="#FFFDF9" stroke-opacity=".55" stroke-width="3" fill="none"/></g>
    <g id="cell"><rect width="30" height="30" rx="9" fill="#EFEADF"/></g>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="330" fill="#2B5C8A" opacity=".06"/>
  <circle cx="120" cy="790" r="270" fill="#2B5C8A" opacity=".05"/>

  <!-- ground -->
  <path d="M0 640 Q600 575 1200 640 V800 H0 Z" fill="#C5D7B3"/>
  <path d="M0 715 Q520 670 1200 720 V800 H0 Z" fill="#B8D39A"/>

