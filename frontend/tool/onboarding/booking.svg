  <path d="M1040 590 h80 l-10 74 h-60 Z" fill="#E9A84A"/>
  <rect x="1034" y="580" width="92" height="18" rx="9" fill="#D48E30"/>
  <use href="#leaf" fill="#4A7C59" transform="translate(1080 580) rotate(-70) scale(1.3)"/>
  <use href="#leaf" fill="#6E9E6F" transform="translate(1076 584) rotate(-130) scale(1.1)"/>
  <use href="#leaf" fill="#3F6E4E" transform="translate(1084 584) rotate(-30) scale(1.05)"/>

  <!-- sparkles -->
  <g fill="#2B5C8A" opacity=".45">
    <path d="M410 120 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 Z"/>
    <path d="M1050 250 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z"/>
