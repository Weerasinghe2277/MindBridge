  <rect x="626" y="414" width="46" height="8" rx="4" fill="#3A6647"/>
  <rect x="506" y="540" width="188" height="48" rx="24" fill="#4A7C59"/>
  <rect x="560" y="560" width="80" height="8" rx="4" fill="#FFFDF9"/>

