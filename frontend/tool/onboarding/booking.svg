  <rect x="604" y="400" width="90" height="36" rx="18" fill="#E6EEDD" stroke="#4A7C59" stroke-width="3"/>
  <rect x="506" y="448" width="86" height="36" rx="18" fill="#E2ECF7"/>
  <rect x="604" y="448" width="90" height="36" rx="18" fill="#E2ECF7"/>
