  <ellipse cx="900" cy="672" rx="90" ry="13" fill="#2F5A3D" opacity=".16"/>
  <rect x="862" y="500" width="30" height="168" rx="15" fill="#2F5A3D"/>
  <rect x="904" y="500" width="30" height="168" rx="15" fill="#3A6647"/>
  <ellipse cx="872" cy="668" rx="26" ry="11" fill="#22261F"/><ellipse cx="925" cy="668" rx="26" ry="11" fill="#22261F"/>
  <path d="M938 410 L956 500" stroke="#2B5C8A" stroke-width="28" stroke-linecap="round"/>
  <circle cx="958" cy="508" r="14" fill="#C68B64"/>
  <rect x="852" y="370" width="94" height="160" rx="40" fill="#2B5C8A"/>
  <path d="M866 402 L790 352" stroke="#2B5C8A" stroke-width="28" stroke-linecap="round"/>
  <circle cx="782" cy="346" r="15" fill="#C68B64"/>
  <rect x="888" y="344" width="22" height="32" rx="9" fill="#B47A55"/>
  <circle cx="899" cy="318" r="38" fill="#C68B64"/>
  <path d="M862 322 C856 282 890 270 914 276 C940 282 946 304 938 322 L936 340 C934 312 912 300 884 304 C872 310 868 326 866 344 Z" fill="#2F2A24"/>
  <circle cx="886" cy="320" r="4" fill="#2F2A24"/><circle cx="912" cy="320" r="4" fill="#2F2A24"/>
  <path d="M890 338 q9 7 18 0" stroke="#8A4E35" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="878" cy="332" r="6" fill="#E58F7E" opacity=".45"/>

