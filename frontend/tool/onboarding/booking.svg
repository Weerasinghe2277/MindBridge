    <rect x="240" y="346" width="12" height="34" rx="6" fill="#2F5A3D"/><rect x="348" y="346" width="12" height="34" rx="6" fill="#2F5A3D"/>
    <g fill="#E2ECF7"><rect x="226" y="430" width="34" height="30" rx="8"/><rect x="283" y="430" width="34" height="30" rx="8"/><rect x="340" y="430" width="34" height="30" rx="8"/>
    <rect x="226" y="480" width="34" height="30" rx="8"/><rect x="340" y="480" width="34" height="30" rx="8"/></g>
