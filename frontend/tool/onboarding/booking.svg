  <rect x="566" y="132" width="68" height="10" rx="5" fill="#2F5A3D" opacity=".85"/>
  <rect x="506" y="166" width="188" height="44" rx="14" fill="#E2ECF7"/>
  <circle cx="530" cy="188" r="12" fill="#2B5C8A"/>
