# Render blueprint: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for:
#   MONGO_URI            your MongoDB Atlas connection string (MONGO_URI in backend/.env)
#   DATA_ENCRYPTION_KEY  must be the SAME value as in backend/.env, so encrypted
#                        journal entries and notes stay readable everywhere
#   CLOUDINARY_URL       optional: cloudinary://<api_key>:<api_secret>@<cloud_name> for file storage
#   GEMINI_API_KEY       optional: Bridge assistant (Google AI Studio key)
#   SMTP_USER / SMTP_PASS  Brevo SMTP login and SMTP key (same values as backend/.env). Emails
#                        one-time codes from mindbrige.support@gmail.com. See README → Email.
services:
  - type: web
    name: mindbridge-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGINS
        value: "*"
      - key: STUDENT_EMAIL_DOMAINS
        value: my.sliit.lk
      - key: STAFF_EMAIL_DOMAINS
        value: sliit.lk
      # One-time codes are only emailed. "true" shows them in the app ONLY while email isn't set up.
      - key: DEMO_MODE
        value: "false"
      # Fills an empty database with the demo accounts on first start (Atlas is already seeded).
      - key: SEED_IF_EMPTY
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # Brevo SMTP for one-time codes. Port 2525: Render's free plan blocks 25/465/587.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: MindBridge Support <mindbrige.support@gmail.com>
      - key: CLOUDINARY_URL
        sync: false
